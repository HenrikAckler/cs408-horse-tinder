<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dependency check | Horse Tinder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
</head>
<body class="bg-light">
  <main class="container py-5" x-data="{ libraries: { Bootstrap: false, Tailwind: false, Alpine: false, Hammer: false }, check() { this.libraries.Bootstrap = getComputedStyle(document.querySelector('.btn-check')).position === 'absolute'; this.libraries.Tailwind = !!window.tailwind; this.libraries.Alpine = !!window.Alpine; this.libraries.Hammer = !!window.Hammer; } }" x-init="setTimeout(() => check(), 500)">
    <h1 class="h2">Dependency check</h1>
    <p>Flask and Jinja rendered this page. SQLite is initialized when the app starts.</p>
    <p class="btn-check" hidden></p>
    <ul class="list-group mb-3">
      <li class="list-group-item">Flask: loaded</li>
      <li class="list-group-item">Jinja: loaded</li>
      <li class="list-group-item">SQLite: initialized</li>
      <template x-for="(loaded, name) in libraries" :key="name">
        <li class="list-group-item d-flex justify-content-between"><span x-text="name"></span><span x-text="loaded ? 'loaded' : 'not detected'" :class="loaded ? 'text-success' : 'text-danger'"></span></li>
      </template>
    </ul>
    <button class="btn btn-outline-primary" @click="check()">Check again</button>
    <a class="btn btn-link" href="{{ url_for('index') }}">Home</a>
  </main>
</body>
</html>
