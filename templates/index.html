<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horse Tinder</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
</head>
<body class="bg-light">
  <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center text-center py-5" x-data="{ ready: true }">
    <h1 class="display-3 fw-bold">Hello, World!</h1>
    <p class="lead">Welcome to Horse Tinder.</p>
    <a class="btn btn-primary" href="{{ url_for('dependencies') }}">Check dependencies</a>
    <p class="mt-3 text-secondary" x-show="ready" x-cloak>Flask and Jinja are running.</p>
  </main>
</body>
</html>
